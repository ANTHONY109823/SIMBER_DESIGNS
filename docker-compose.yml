services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: simber-postgres
    environment:
      POSTGRES_USER: simber
      POSTGRES_PASSWORD: simber_dev
      POSTGRES_DB: simber_designs
    ports:
      - "5432:5432"
    volumes:
      - simber_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simber -d simber_designs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  simber_pgdata:
